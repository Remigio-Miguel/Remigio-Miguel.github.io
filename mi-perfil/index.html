<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#12304A">
    <title>Mi perfil | Tecnicos Ya</title>
    <link rel="stylesheet" href="/shared.css">
    <link rel="stylesheet" href="/mi-perfil/mi-perfil.css">
    <script src="/shared.js" defer></script>
    <script src="/mi-perfil/mi-perfil.js" defer></script>
</head>

<body>
    <header data-site-header></header>
    <main>
        <section class="page-top">
            <div class="container"><span class="eyebrow">Tu cuenta</span>
                <h1>Mi perfil</h1>
                <p>Consulta y actualiza los datos que usas para solicitar servicios.</p>
            </div>
        </section>
        <section class="page-content">
            <div class="container profile-account-layout">
                <form id="profile-form" class="form-card">
                    <div class="profile-account-heading"><span class="profile-avatar" aria-hidden="true">AS</span>
                        <div>
                            <h2>Datos personales</h2>
                            <p>Tu información de contacto</p>
                        </div>
                    </div>
                    <div class="form-grid"><label class="field field--wide"><span>Nombre completo</span><input
                                name="name" autocomplete="name" value="Andrea Salazar" required></label><label
                            class="field"><span>Correo electrónico</span><input name="email" type="email"
                                autocomplete="email" value="andrea@ejemplo.com" required></label><label
                            class="field"><span>Teléfono</span><input name="phone" type="tel" autocomplete="tel"
                                value="999 999 999" required></label><label
                            class="field field--wide"><span>Distrito</span><select name="district">
                                <option>Surco</option>
                                <option>Miraflores</option>
                                <option>San Borja</option>
                                <option>San Isidro</option>
                                <option>La Molina</option>
                            </select></label></div>
                    <div class="form-actions"><button class="button" type="submit">Guardar cambios</button><a
                            class="button button--secondary" href="/mis-solicitudes/">Ver mis solicitudes</a></div>
                    <p id="profile-message" class="notice is-hidden" role="status"></p>
                </form>
                <aside class="card card--pad profile-activity">
                    <p class="section-heading">Mi actividad</p>
                    <h2>Servicios para tu hogar</h2>
                    <p class="muted">Revisa las reservas, el estado de tus solicitudes y tus calificaciones.</p><a
                        class="button button--secondary" href="/mis-solicitudes/">Ir a mis solicitudes →</a>
                </aside>
            </div>
        </section>
    </main>
    <footer data-site-footer></footer>
</body>

</html>
